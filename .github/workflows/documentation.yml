name: Run format, Build Sphinx Documentation, tests

on:
  pull_request:
    # "edited" also runs the checks again when the base branch of a pull request is changed,
    # e.g. from develop to main; otherwise the old results of the other base would still count.
    types: [opened, synchronize, reopened, edited]

jobs:

  # "format" is a required check for main, so the version check runs here: a failing
  # version check blocks the merge. (A separate job would not: skipped or failed jobs that
  # are not required do not block, and a required job skipped by a failed dependency passes.)
  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    # Only for pull requests into main (releases): pyproject.toml and __init__.py match,
    # the version is higher than on main and not on PyPI yet. Not run for develop.
    - name: Version check (PR into main)
      if: github.base_ref == 'main'
      run: |
        git fetch --no-tags --depth=1 origin main
        python scripts/check_version.py --compare-ref origin/main --pypi

    - name: Code Format Check
      run: |
        ruff check .

