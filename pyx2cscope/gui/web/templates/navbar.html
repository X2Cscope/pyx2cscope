<!-- Navbar -->
<header class="bg-primary text-white p-3 d-flex justify-content-between align-items-center">
    <h1 class="h5 mb-0">{{ title }} <small>{{ version }}</small>
        <span id="project-name" class="badge bg-light text-primary ms-2{% if not project_name %} d-none{% endif %}"
              title="Project of the loaded ELF file" data-base-title="{{ title }}">{{ project_name }}</span>
    </h1>
    <div class="d-flex align-items-center gap-3">
        <a href="#" id="exportVariablesToggle" class="text-white disabled" title="Export variables" aria-disabled="true">
            <span class="material-icons md-24">upload_file</span>
        </a>
        <a href="#" id="saveConfigToggle" class="text-white disabled" title="Save config (watch &amp; scope variables)" aria-disabled="true">
            <span class="material-icons md-24">save</span>
        </a>
        <input type="file" accept=".json" class="d-none" id="configFileInput">
        <a href="#" id="loadConfigToggle" class="text-white disabled" title="Load config (watch &amp; scope variables)" aria-disabled="true">
            <span class="material-icons md-24">folder_open</span>
        </a>
        <a href="#" id="helpToggle" class="text-white" title="Toggle help">
            <span class="material-icons md-24">help_outline</span>
        </a>
        <a href="#" id="connection-status" class="text-white text-decoration-underline"></a>
    </div>
</header>
